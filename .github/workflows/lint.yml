name: Lint HTML/CSS

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run HTML/CSS analysis
        uses: ./
        with:
          # Self-test against a known-clean fixture; point this at your submissions folder.
          path: "tests/fixtures/good"
          fail-on: "error"
          lang: "es"
