name: Lint HTML/CSS

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HTML/CSS analysis
        uses: ./
        with:
          # Self-test against a known-clean fixture; point this at your submissions folder.
          path: "tests/fixtures/good"
          fail-on: "error"
          lang: "es"
